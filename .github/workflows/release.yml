name: Release Executables

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install pyinstaller

      - name: Build Windows exe
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File server/build.ps1 -Name nfa95

      - name: Upload Artifact (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: nfa95-windows-x64
          path: |
            dist/nfa95.exe
            dist/.env.example

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Linux binary in manylinux2014 (glibc 2.17)
        shell: bash
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/src -w /src quay.io/pypa/manylinux2014_x86_64 \
            /bin/bash -lc '
              set -euo pipefail;
              yum -y install wget curl make gcc zlib-devel bzip2-devel libffi-devel xz-devel sqlite-devel readline-devel tk-devel perl;
              # Build OpenSSL and ensure system can locate libs
              OPENSSL_VER=1.1.1w;
              cd /tmp && curl -fsSLO https://www.openssl.org/source/openssl-${OPENSSL_VER}.tar.gz && tar xf openssl-${OPENSSL_VER}.tar.gz;
              cd openssl-${OPENSSL_VER};
              ./config --prefix=/opt/openssl --openssldir=/opt/openssl -fPIC;
              make -j2 && make install_sw;
              echo "/opt/openssl/lib" > /etc/ld.so.conf.d/openssl.conf && ldconfig;
              export OPENSSL_DIR=/opt/openssl;
              export CPPFLAGS="-I${OPENSSL_DIR}/include";
              export LDFLAGS="-Wl,-rpath,${OPENSSL_DIR}/lib -L${OPENSSL_DIR}/lib";
              export PKG_CONFIG_PATH="${OPENSSL_DIR}/lib/pkgconfig";
              # Build shared CPython
              PY_VER=3.11.9;
              cd /tmp && curl -fsSLO https://www.python.org/ftp/python/${PY_VER}/Python-${PY_VER}.tgz && tar xf Python-${PY_VER}.tgz;
              cd Python-${PY_VER};
              ./configure --enable-optimizations --enable-shared --with-openssl=${OPENSSL_DIR} --prefix=/opt/python/cp311-shared;
              make -j2 && make install;
              echo "/opt/python/cp311-shared/lib" > /etc/ld.so.conf.d/python.conf && ldconfig;
              export PATH="/opt/python/cp311-shared/bin:$PATH";
              export LD_LIBRARY_PATH="/opt/python/cp311-shared/lib:${OPENSSL_DIR}/lib:$LD_LIBRARY_PATH";
              cd /src;
              python3 -m pip install --upgrade pip;
              python3 -m pip install -r server/requirements.txt pyinstaller;
              chmod +x server/build.sh;
              ./server/build.sh nfa95;
            '

      - name: Upload Artifact (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: nfa95-linux-x64
          path: |
            dist/nfa95
            dist/.env.example

  release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: nfa95-windows-x64
          path: ./artifacts/windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: nfa95-linux-x64
          path: ./artifacts/linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          files: |
            artifacts/windows/nfa95.exe
            artifacts/linux/nfa95
            server/.env.example
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Gitee Release Assets
        id: sync_gitee_release_assets
        timeout-minutes: 6
        continue-on-error: true
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF:-}" != refs/tags/* ]]; then
            echo "[gitee] not a tag push, skip syncing."
            exit 0
          fi
          if [[ -z "${GITEE_TOKEN:-}" ]]; then
            echo "[gitee] GITEE_TOKEN is empty, skip syncing."
            exit 0
          fi
          TAG_NAME="${GITHUB_REF_NAME}"
          OWNER="ThinkHao"
          REPO="nfatool"
          API_BASE="https://gitee.com/api/v5/repos/${OWNER}/${REPO}"
          API_CURL_OPTS=(--connect-timeout 15 --max-time 120 --retry 5 --retry-delay 2 --retry-connrefused)
          UPLOAD_CURL_OPTS=(--connect-timeout 20 --max-time 600 --retry 5 --retry-delay 3 --retry-connrefused --retry-all-errors)
          UPLOAD_CURL_OPTS_EXE=(--connect-timeout 20 --max-time 180 --retry 1 --retry-delay 2 --retry-connrefused --retry-all-errors)

          echo "[gitee] target repo: ${OWNER}/${REPO}, tag: ${TAG_NAME}"

          curl_api() {
            curl "${API_CURL_OPTS[@]}" -sS "$@"
          }

          curl_upload() {
            curl "${UPLOAD_CURL_OPTS[@]}" -sS "$@"
          }

          curl_upload_exe() {
            curl "${UPLOAD_CURL_OPTS_EXE[@]}" -sS "$@"
          }

          parse_json_field() {
            local key="$1"
            local raw="$2"
            python -c "import json,sys; obj=json.loads(sys.argv[2] or 'null'); obj=obj if isinstance(obj, dict) else {}; v=obj.get(sys.argv[1]); print('' if v is None else str(v))" "$key" "$raw"
          }

          parse_asset_id_by_name() {
            local name="$1"
            local raw="$2"
            python -c "import json,sys; target=sys.argv[1]; obj=json.loads(sys.argv[2] or 'null'); obj=(obj.get('assets') or obj.get('attach_files') or []) if isinstance(obj, dict) else (obj if isinstance(obj, list) else []); print(next((str((x or {}).get('id') or '') for x in obj if isinstance(x, dict) and str(x.get('name') or '')==target), ''))" "$name" "$raw"
          }

          # 1) resolve release id by tag; create if not exists
          release_resp="$(curl_api -w $'\n%{http_code}' "${API_BASE}/releases/tags/${TAG_NAME}?access_token=${GITEE_TOKEN}")"
          release_body="$(echo "${release_resp}" | sed '$d')"
          release_code="$(echo "${release_resp}" | tail -n1)"
          release_id=""

          if [[ "${release_code}" == "200" ]]; then
            release_id="$(parse_json_field id "${release_body}")"
          elif [[ "${release_code}" == "404" ]]; then
            release_id=""
          else
            echo "[gitee] fetch release failed: HTTP ${release_code}"
            echo "${release_body}"
            exit 1
          fi

          if [[ -z "${release_id}" ]]; then
            echo "[gitee] release not found by tag, creating one..."
            create_resp="$(curl_api -w $'\n%{http_code}' -X POST "${API_BASE}/releases" \
              -d "access_token=${GITEE_TOKEN}" \
              -d "tag_name=${TAG_NAME}" \
              -d "target_commitish=main" \
              -d "name=${TAG_NAME}" \
              -d "body=Synced from GitHub Actions run ${GITHUB_RUN_ID}")"
            create_body="$(echo "${create_resp}" | sed '$d')"
            create_code="$(echo "${create_resp}" | tail -n1)"
            if [[ "${create_code}" != "201" && "${create_code}" != "200" ]]; then
              echo "[gitee] create release failed: HTTP ${create_code}"
              echo "${create_body}"
              exit 1
            fi
            release_id="$(parse_json_field id "${create_body}")"
          fi

          if [[ -z "${release_id}" ]]; then
            echo "[gitee] release id is empty"
            exit 1
          fi
          echo "[gitee] release id: ${release_id}"

          # 2) replace assets with same name, then upload new files
          echo "[gitee] fetch existing assets list..."
          attach_list="$(curl_api "${API_BASE}/releases/${release_id}/attach_files?access_token=${GITEE_TOKEN}")"
          for file in artifacts/linux/nfa95 server/.env.example artifacts/windows/nfa95.exe; do
            name="$(basename "${file}")"
            echo "[gitee] syncing asset: ${name}"
            existing_id="$(parse_asset_id_by_name "${name}" "${attach_list}")"
            if [[ -n "${existing_id}" ]]; then
              echo "[gitee] deleting existing asset id=${existing_id} (${name})"
              curl_api -X DELETE "${API_BASE}/releases/${release_id}/attach_files/${existing_id}?access_token=${GITEE_TOKEN}" >/dev/null
            fi
            echo "[gitee] uploading ${name} ..."
            if [[ "${name}" == "nfa95.exe" ]]; then
              if ! curl_upload_exe -X POST "${API_BASE}/releases/${release_id}/attach_files" \
                -H "Expect:" \
                -F "access_token=${GITEE_TOKEN}" \
                -F "file=@${file}" >/dev/null; then
                echo "[gitee] WARN: upload ${name} failed; continue without blocking release."
                continue
              fi
            else
              curl_upload -X POST "${API_BASE}/releases/${release_id}/attach_files" \
                -H "Expect:" \
                -F "access_token=${GITEE_TOKEN}" \
                -F "file=@${file}" >/dev/null
            fi
            echo "[gitee] uploaded ${name}"
          done

      - name: Gitee Sync Summary
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.sync_gitee_release_assets.outcome }}" == "success" ]]; then
            echo "[gitee] sync step succeeded."
          else
            echo "[gitee] WARN: sync step failed or timed out; GitHub release is still available."
          fi
